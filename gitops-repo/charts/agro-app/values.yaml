replicaCount: 3

image:
  repository: abuseven/agro-app
  # Updated automatically by the CI pipeline with the commit SHA.
  tag: "ae13588b029952c2ccfbada9dbb26bef106fd3be"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 5000
  name: web

metrics:
  enabled: true
  path: /metrics
  # Label that kube-prometheus-stack uses to discover ServiceMonitors
  releaseLabel: kube-prometheus-stack

serviceAccount:
  create: true
  name: ""

probes:
  readinessPath: /health
  livenessPath: /health

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
