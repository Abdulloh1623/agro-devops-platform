{{- if .Values.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "agro-app.fullname" . }}
  labels:
    {{- include "agro-app.labels" . | nindent 4 }}
    release: {{ .Values.metrics.releaseLabel | default "kube-prometheus-stack" }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "agro-app.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: web
      path: {{ .Values.metrics.path | default "/metrics" }}
      interval: 15s
{{- end }}
