name: CI-CD

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Install deps
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: app
        run: pytest -q

  build-push-deploy:
    # Images are only published from main; PRs run tests only.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (latest + sha)
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agro-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/agro-app:${{ github.sha }}

      # GitOps step: write the new immutable tag into the Helm values so
      # ArgoCD detects the change and rolls out this exact image.
      - name: Update image tag in Helm values
        run: |
          sed -i -E 's|^(\s*tag:\s*).*$|\1"${{ github.sha }}"|' gitops-repo/charts/agro-app/values.yaml
          grep -n 'tag:' gitops-repo/charts/agro-app/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops-repo/charts/agro-app/values.yaml
          git diff --cached --quiet || git commit -m "ci: deploy agro-app ${{ github.sha }} [skip ci]"
          git push
